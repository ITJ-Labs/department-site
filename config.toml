baseURL = "https://ITJ-Labs.github.io/"
languageCode = "en-us"
title = "ITJ Labs Department"
theme = "PaperMod"


[params]
  # ITJ Royal Blue in HSL
  primaryHue = 220
  primarySaturation = 80
  primaryLightness = 50

  # Lighter accent blue
  accentHue = 220
  accentSaturation = 80
  accentLightness = 60

  # Enable dark mode toggle
  disableDarkMode = false

  # Include your new CSS for button branding
  customCSS = ["css/itj-brand.css", "css/button-brand.css"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
