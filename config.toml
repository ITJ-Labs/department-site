baseURL = "https://itj-labs.github.io/department-site/"
languageCode = "en-us"
title = "ITJ Labs Department"
theme = "PaperMod"

[params]
  primaryHue       = 220
  primarySaturation = 80
  primaryLightness = 50

  accentHue        = 220
  accentSaturation = 80
  accentLightness = 60

  disableDarkMode  = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]

  [[menu.main]]
    identifier = "home"
    name       = "Home"
    url        = "/"
    weight     = 10

  [[menu.main]]
    identifier = "about"
    name       = "About"
    url        = "/about/"
    weight     = 20

  [[menu.main]]
    identifier = "services"
    name       = "Services"
    url        = "/services/"
    weight     = 30

  [[menu.main]]
    identifier = "publications"
    name       = "Publications"
    url        = "/publications/"
    weight     = 40

  [[menu.main]]
    identifier = "events"
    name       = "Events"
    url        = "/events/"
    weight     = 50

  [[menu.main]]
    identifier = "contact"
    name       = "Contact"
    url        = "/contact/"
    weight     = 60
