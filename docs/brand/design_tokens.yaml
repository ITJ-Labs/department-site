# ITJ Solutions — AI Solutions Design Tokens
# Slice: SF-SLICE-087D.0 — Corporate Brand Discovery
# Date: 2026-06-25
# Status: DRAFT — Pending executive brand alignment
#
# Notation:
#   status: canonical   — confirmed and ready for implementation
#   status: placeholder — current best value; must be confirmed with ITJ brand team
#   status: decision    — requires stakeholder decision before implementation
#   status: gap         — no current value; token must be defined from scratch
#
# NOTE: This file contains token definitions ONLY.
# No CSS. No implementation. No :root {} blocks.
# Implementation will be delivered in SF-SLICE-087D.1.

meta:
  project: AI Solutions Digital Platform
  brand: ITJ Solutions — AI Solutions (sub-brand)
  parent_brand: ITJ Solutions (itj.com)
  parent_brand_direction: blue-to-purple gradient
  status: draft

# ──────────────────────────────────────────────────────────────────────────────
# COLOR TOKENS
# ──────────────────────────────────────────────────────────────────────────────

colors:

  # ── Brand Primary ─────────────────────────────────────────────────────────
  # Derived from config.toml: primaryHue=220, primarySaturation=80, primaryLightness=50
  # Aligns with ITJ corporate blue direction.
  # Must be confirmed against itj.com exact blue before 087D.1.
  brand:
    primary:
      value: "hsl(220, 80%, 50%)"
      hex: "#1a5ee6"
      status: placeholder
      note: >
        Canonical blue from config.toml. 6 different blues currently exist in CSS.
        All hardcoded blues (#0057ff, #0366d6, #007acc, #337aff, #007bff, hsl(220,80%,50%))
        should be replaced by this single token after brand confirmation.
    primary-hover:
      value: "hsl(220, 80%, 42%)"
      hex: "#134fc4"
      status: placeholder
      note: Approximately 8% lighter than primary. Used for button hover, link hover.
    primary-active:
      value: "hsl(220, 80%, 36%)"
      hex: "#1042a9"
      status: placeholder
      note: Pressed/active state.
    primary-light:
      value: "hsl(220, 80%, 60%)"
      hex: "#4a84f9"
      status: placeholder
      note: Accent value from config.toml accentLightness=60. Used for decorative highlights.
    primary-subtle:
      value: "hsl(220, 80%, 96%)"
      hex: "#ebf1fe"
      status: placeholder
      note: Very light tint for hover backgrounds, selected states.

  # ── Brand Secondary / CTA ──────────────────────────────────────────────────
  # Current state: 4 different greens used inconsistently.
  # Green (#28a745) originated from GitHub's color system, not ITJ brand.
  # Whether CTA remains green or shifts to a blue variant is a BUSINESS DECISION.
    secondary:
      value: "DECISION_REQUIRED"
      status: decision
      note: >
        Current state: #28a745 (GitHub green) used for CTA buttons and success states.
        Options:
          A) Keep green as CTA accent — maintains visual contrast vs primary blue buttons.
          B) Replace with ITJ brand accent — purple or teal from corporate gradient.
          C) Use primary blue for all CTAs — simpler token model.
        Stakeholder decision required before implementation.
    secondary-hover:
      value: "DECISION_REQUIRED"
      status: decision
      note: Defined once secondary value is confirmed.

  # ── Semantic ───────────────────────────────────────────────────────────────
  semantic:
    success:
      value: "#2e7d32"
      status: placeholder
      note: >
        Currently 3 different greens used as success color.
        #2e7d32 is the Material Design green-800, most intentional-looking value found.
        Align with secondary brand color once secondary is decided.
    warning:
      value: "#b45309"
      status: gap
      note: No warning color defined in codebase. This is a suggested value (amber-700).
    danger:
      value: "#dc2626"
      status: gap
      note: >
        #dc3545 (Bootstrap red) appears only in publications card hover — likely unintentional.
        Needs an intentional danger token defined separately from that hover state.
    info:
      value: "#0369a1"
      status: gap
      note: No info color defined. This is a suggested value (sky-700).

  # ── Text ──────────────────────────────────────────────────────────────────
  text:
    primary:
      value: "#111111"
      status: canonical
      note: Dark text on light background. Consolidates #111, #1a1a1a, #222.
    secondary:
      value: "#444444"
      status: canonical
      note: Body secondary text. Consolidates #333, #444, #555.
    muted:
      value: "#666666"
      status: canonical
      note: Placeholder, captions, metadata.
    disabled:
      value: "#999999"
      status: gap
      note: No disabled text color defined. Suggested value.
    inverse:
      value: "#ffffff"
      status: canonical
      note: Text on dark/colored backgrounds. Used in nav, dark sections.
    inverse-muted:
      value: "#e0e0e0"
      status: canonical
      note: Subdued text on dark backgrounds. Found in services.css dark sections.
    link:
      value: "color.brand.primary"
      status: canonical
      note: Links default to primary brand color via PaperMod --primary variable.
    link-hover:
      value: "color.brand.primary-hover"
      status: canonical

  # ── Background ──────────────────────────────────────────────────────────────
  background:
    page:
      value: "#ffffff"
      status: canonical
      note: Main page background. PaperMod --background in light mode.
    surface:
      value: "#ffffff"
      status: canonical
      note: Card and panel background.
    surface-alt:
      value: "#f9f9f9"
      status: canonical
      note: Alternating section backgrounds. Consolidates #f5f5f5 and #f9f9f9.
    overlay:
      value: "rgba(0, 0, 0, 0.4)"
      status: canonical
      note: Mobile nav drawer backdrop (.nav-overlay).
    dark-section:
      value: "#0f172a"
      status: gap
      note: >
        services.css uses inline dark backgrounds for feature blocks.
        No canonical dark background token defined. Suggested value: slate-900.

  # ── Border ────────────────────────────────────────────────────────────────
  border:
    default:
      value: "#e1e1e1"
      status: canonical
      note: Standard card and component borders. Consolidates #ccc, #e1e1e1, rgba(0,0,0,0.15).
    subtle:
      value: "rgba(0, 0, 0, 0.08)"
      status: canonical
      note: Very light borders, icon frames.
    focus:
      value: "color.brand.primary"
      status: decision
      note: >
        Currently #2e7d32 (green) for contact form focus ring.
        Should change to primary blue — aligns focus ring with brand color.
        Confirm before implementation.

# ──────────────────────────────────────────────────────────────────────────────
# TYPOGRAPHY TOKENS
# ──────────────────────────────────────────────────────────────────────────────

typography:

  # ── Font Family ───────────────────────────────────────────────────────────
  font-family:
    base:
      value: >
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
      status: placeholder
      note: >
        PaperMod system font stack. No webfont currently defined.
        Decision required: keep system fonts or introduce enterprise webfont?
        Candidates: Inter, IBM Plex Sans, Source Sans Pro.
    webfont:
      value: "DECISION_REQUIRED"
      status: decision
      note: >
        ITJ corporate typeface not confirmed. Requires inspection of itj.com CSS
        or brand guidelines document from brand team.
    mono:
      value: "'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace"
      status: canonical
      note: Code blocks. PaperMod default.

  # ── Type Scale ────────────────────────────────────────────────────────────
  # Based on ad-hoc sizes found across CSS files. Not a formal scale currently.
  # Suggested canonical scale. Values must be reviewed before 087D.1.
  scale:
    display:
      value: "3rem"      # 48px
      status: gap
      note: Not currently used. Suggested hero display size.
    h1:
      value: "2.5rem"    # 40px
      status: canonical
      note: Hero page title. Found in hero.html styles.
    h2:
      value: "2rem"      # 32px
      status: canonical
      note: Section headers. why-itj, cta, featured-service.
    h3:
      value: "1.5rem"    # 24px
      status: canonical
      note: Subsection, card titles. contact, featured-content.
    h4:
      value: "1.25rem"   # 20px
      status: canonical
      note: Event titles, pub cards.
    h5:
      value: "1.1rem"    # 17.6px
      status: gap
      note: Not currently defined. Suggested.
    body-lg:
      value: "1.125rem"  # 18px
      status: gap
      note: Larger body text. Not currently defined.
    body:
      value: "1rem"      # 16px
      status: canonical
      note: Default body text.
    body-sm:
      value: "0.95rem"   # 15.2px
      status: canonical
      note: Subtitle, metadata text.
    caption:
      value: "0.875rem"  # 14px
      status: canonical
      note: Small labels, badge text.
    micro:
      value: "0.75rem"   # 12px
      status: gap
      note: Not defined. Suggested for legal, footnotes.

  # ── Font Weight ───────────────────────────────────────────────────────────
  weight:
    regular:
      value: 400
      status: canonical
    medium:
      value: 500
      status: canonical
      note: Nav items, labels.
    semibold:
      value: 600
      status: canonical
      note: Buttons, form labels, emphasized text.
    bold:
      value: 700
      status: canonical
      note: Headings.

  # ── Line Height ───────────────────────────────────────────────────────────
  line-height:
    tight:
      value: 1.2
      status: canonical
      note: Headings.
    compact:
      value: 1.4
      status: canonical
      note: Dense UI text.
    default:
      value: 1.6
      status: canonical
      note: Body text. Most common value across CSS files.

# ──────────────────────────────────────────────────────────────────────────────
# SPACING TOKENS
# ──────────────────────────────────────────────────────────────────────────────

# Base unit: 4px. Scale: 1 2 3 4 6 8 12 16 20 24 32 (multiples of 4px base).
# Current codebase uses ad-hoc rem values. These tokens codify the intent.

spacing:
  1:
    value: "0.25rem"   # 4px
    status: gap
  2:
    value: "0.5rem"    # 8px
    status: canonical
    note: Tight component padding, icon margins.
  3:
    value: "0.75rem"   # 12px
    status: canonical
  4:
    value: "1rem"      # 16px
    status: canonical
    note: Standard component padding.
  5:
    value: "1.25rem"   # 20px
    status: gap
  6:
    value: "1.5rem"    # 24px
    status: canonical
    note: Card inner padding, grid gaps.
  8:
    value: "2rem"      # 32px
    status: canonical
    note: Standard section padding, card padding (large).
  10:
    value: "2.5rem"    # 40px
    status: gap
  12:
    value: "3rem"      # 48px
    status: canonical
    note: Section vertical padding (mobile).
  16:
    value: "4rem"      # 64px
    status: canonical
    note: Section vertical padding (desktop).
  20:
    value: "5rem"      # 80px
    status: canonical
    note: Large section vertical padding.

# ──────────────────────────────────────────────────────────────────────────────
# BORDER RADIUS TOKENS
# ──────────────────────────────────────────────────────────────────────────────

border-radius:
  none:
    value: "0"
    status: canonical
  sm:
    value: "4px"
    status: gap
    note: Not found in codebase. Suggested for small UI elements.
  button:
    value: "6px"
    status: canonical
    note: Buttons and form inputs. Consistent across most of codebase.
  badge:
    value: "8px"
    status: canonical
    note: Badges, small labels.
  card:
    value: "12px"
    status: canonical
    note: Standard card radius. Most common value. Supersedes 10px and 16px variants.
  card-lg:
    value: "16px"
    status: placeholder
    note: Featured/elevated card. Currently only in featured-service.css. May consolidate to card.
  pill:
    value: "9999px"
    status: canonical
    note: Full-pill shape. Currently used in publications filter buttons.

# ──────────────────────────────────────────────────────────────────────────────
# SHADOW TOKENS
# ──────────────────────────────────────────────────────────────────────────────

shadow:
  sm:
    value: "0 2px 8px rgba(0, 0, 0, 0.06)"
    status: canonical
    note: Cards at rest. Consolidates 0.04–0.08 alpha variants at 2-8px spread.
  md:
    value: "0 4px 20px rgba(0, 0, 0, 0.08)"
    status: canonical
    note: Contact card, elevated components.
  lg:
    value: "0 8px 32px rgba(0, 0, 0, 0.10)"
    status: canonical
    note: CTA card, hero, featured components.
  button-primary:
    value: "0 4px 12px rgba(26, 94, 230, 0.30)"
    status: placeholder
    note: Blue button hover shadow. Update hex to match confirmed primary.
  button-secondary:
    value: "0 4px 12px rgba(46, 125, 50, 0.35)"
    status: decision
    note: Green button hover shadow. Update once secondary color is decided.

# ──────────────────────────────────────────────────────────────────────────────
# BREAKPOINT TOKENS
# ──────────────────────────────────────────────────────────────────────────────

breakpoints:
  mobile:
    value: "400px"
    status: canonical
    note: Button goes full-width below this value. Found in multiple files.
  tablet:
    value: "600px"
    status: canonical
    note: Team grid collapses below this value.
  desktop:
    value: "768px"
    status: canonical
    note: Sidebar nav activates. Mobile drawer hidden. Primary layout breakpoint.

# ──────────────────────────────────────────────────────────────────────────────
# CONTAINER TOKENS
# ──────────────────────────────────────────────────────────────────────────────

container:
  page:
    value: "calc(960px - 220px)"   # 740px
    status: canonical
    note: Main content width with desktop sidebar active. Defined in nav.css.
  xl:
    value: "1080px"
    status: canonical
    note: Quick-links grid. Largest container in use.
  lg:
    value: "960px"
    status: canonical
    note: Featured service, hero section.
  md:
    value: "900px"
    status: canonical
    note: Services intro section.
  sm:
    value: "800px"
    status: canonical
    note: About, publications, CTA.
  xs:
    value: "600px"
    status: canonical
    note: Featured content box, hero quote.

# ──────────────────────────────────────────────────────────────────────────────
# Z-INDEX TOKENS
# ──────────────────────────────────────────────────────────────────────────────

z-index:
  nav-overlay:
    value: 999
    status: canonical
    note: Mobile nav backdrop (.nav-overlay). Below nav drawer.
  nav-drawer:
    value: 1000
    status: canonical
    note: Sidebar/drawer (.main-nav). Above overlay.
  nav-toggle:
    value: 1001
    status: canonical
    note: Hamburger button. Above nav drawer to remain tappable.
  modal:
    value: 1100
    status: gap
    note: Not yet used. Reserved for future modal components.
  tooltip:
    value: 1200
    status: gap
    note: Not yet used. Reserved for future tooltip components.

# ──────────────────────────────────────────────────────────────────────────────
# TRANSITION TOKENS
# ──────────────────────────────────────────────────────────────────────────────

transition:
  fast:
    value: "0.2s ease"
    status: canonical
    note: Buttons, card hover lift, link color changes. Most common duration.
  medium:
    value: "0.3s ease"
    status: canonical
    note: Nav drawer open/close, partner logo reveal.
  slow:
    value: "0.6s ease"
    status: canonical
    note: Card fade-in animations on scroll. Less common.

# ──────────────────────────────────────────────────────────────────────────────
# DECISIONS REQUIRED BEFORE IMPLEMENTATION (SF-SLICE-087D.1)
# ──────────────────────────────────────────────────────────────────────────────

decisions_required:
  - id: D-01
    token: colors.brand.primary
    question: What is the exact hex value for ITJ Solutions corporate blue?
    options:
      - "hsl(220, 80%, 50%) = #1a5ee6 (current placeholder)"
      - "Extract from itj.com CSS via browser DevTools"
      - "Obtain from ITJ brand guidelines document"
    blocking: true

  - id: D-02
    token: colors.brand.secondary
    question: Should the CTA color remain green or shift to ITJ blue/purple?
    options:
      - "Keep #28a745 green — maintains visual contrast with blue primary buttons"
      - "Replace with ITJ purple/violet — aligns with corporate gradient endpoint"
      - "Collapse all CTAs to primary blue — single brand color"
    blocking: true

  - id: D-03
    token: typography.font-family.webfont
    question: Should AI Solutions introduce an enterprise webfont?
    options:
      - "Keep system fonts — zero loading cost, acceptable for v1"
      - "Inter — modern, open-source, increasingly common in enterprise"
      - "IBM Plex Sans — technical credibility, open-source"
      - "Match ITJ corporate site webfont — requires CSS inspection of itj.com"
    blocking: false

  - id: D-04
    token: site_title
    question: What is the official name for the site in browser title and header?
    options:
      - "AI Solutions"
      - "ITJ Solutions — AI Solutions"
      - "ITJ Labs — AI Solutions"
    blocking: true
    note: Current value in config.toml is 'ITJ Labs Department' — incorrect.

  - id: D-05
    token: colors.brand.secondary (focus-ring)
    question: Should form focus rings use primary blue or remain green?
    options:
      - "Primary blue — consistent with brand color system"
      - "Keep green — visible and accessible"
    blocking: false
    note: Current contact.css uses #2e7d32 green focus ring, inconsistent with blue primary.
