# ──────────────────────────────────────────────────────────────────────────────
# COLOR TOKENS
# ──────────────────────────────────────────────────────────────────────────────

colors:

  # ── Brand Primary ─────────────────────────────────────────────────────────
  # D-01 RESOLVED (config-derived): itj.com is JS-rendered; CSS not extractable
  # via WebFetch. Using config.toml: primaryHue=220, S=80, L=50 = #1a5ee6.
  # Flagged as pending official ITJ brand confirmation.
  brand:
    primary:
      value: "hsl(220, 80%, 50%)"
      hex: "#1a5ee6"
      css-var: "--color-primary"
      status: implemented
      note: >
        Config-derived. All 6 ad-hoc blues replaced in 087D.1.
        Pending official ITJ corporate blue confirmation.
    primary-hover:
      value: "hsl(220, 80%, 42%)"
      hex: "#134fc4"
      css-var: "--color-primary-hover"
      status: implemented
      note: ~8% darker lightness. Button and link hover state.
    primary-light:
      value: "hsl(220, 80%, 60%)"
      hex: "#4a84f9"
      css-var: "--color-primary-light"
      status: implemented
      note: Accent value from config.toml accentLightness=60. Gradient highlights.
    primary-glow:
      value: "rgba(26, 94, 230, 0.30)"
      css-var: "--color-primary-glow"
      status: implemented
      note: Button hover shadow, derived from primary rgb(26, 94, 230).
    primary-focus-ring:
      value: "rgba(26, 94, 230, 0.20)"
      css-var: "--color-primary-focus-ring"
      status: implemented
      note: Focus ring shadow for inputs and interactive elements (D-05 resolved).

  # ── Semantic ───────────────────────────────────────────────────────────────
  semantic:
    success:
      value: "#2e7d32"
      css-var: "--color-success"
      status: implemented
      note: >
        D-02 resolved: green reserved for success/status indicators only.
        All CTA buttons changed to --color-primary in 087D.1.
        #2e7d32 is the canonical success green (Material green-800).
    success-hover:
      value: "#256329"
      css-var: "--color-success-hover"
      status: implemented
    success-glow:
      value: "rgba(46, 125, 50, 0.35)"
      css-var: "--color-success-glow"
      status: implemented
    warning:
      value: "#b45309"
      status: defined
      note: Amber-700. Defined in ds-alert-warning. Not yet used in page CSS.
    danger:
      value: "#dc2626"
      status: gap
      note: No danger/error color defined. Needs intentional definition.
    info:
      value: "#0369a1"
      status: gap
      note: No info color defined. Suggested value (sky-700).

  # ── Text ──────────────────────────────────────────────────────────────────
  text:
    primary:
      value: "#111111"
      css-var: "--color-text-primary"
      status: implemented
      note: >
        Dark text on light background. Consolidates #111, #1a1a1a, #222.
        NOTE: #1a1a1a, #222222 still hardcoded in some files — value mismatch.
    secondary:
      value: "#444444"
      css-var: "--color-text-secondary"
      status: implemented
      note: >
        Body secondary text. Consolidates #333, #444, #555.
        NOTE: #333, #555 still hardcoded in some files — value mismatch.
    muted:
      value: "#666666"
      css-var: "--color-text-muted"
      status: implemented
      note: Placeholder, captions, metadata.
    disabled:
      value: "#999999"
      status: gap
      note: No disabled text color defined. Suggested value.

  # ── Surfaces ──────────────────────────────────────────────────────────────
  surface:
    default:
      value: "#ffffff"
      css-var: "--color-surface"
      status: implemented
    alt:
      value: "#f9f9f9"
      css-var: "--color-surface-alt"
      status: implemented
      note: Alternating section backgrounds. Consolidates #f5f5f5 and #f9f9f9.
    warm:
      value: "#fdfdfd"
      css-var: "--brand-surface-warm"
      status: defined
      note: Warm white for elevated panels (featured-service.css). In brand.css.
    overlay:
      value: "rgba(0, 0, 0, 0.40)"
      css-var: "--color-overlay"
      status: implemented
      note: Mobile nav drawer backdrop.
    dark:
      value: "#0f172a"
      status: gap
      note: >
        services.css uses dark ambient backgrounds for feature blocks.
        No token yet. Suggested: slate-900. Required for TD-M11.

  # ── Borders ───────────────────────────────────────────────────────────────
  border:
    default:
      value: "#e1e1e1"
      css-var: "--color-border"
      status: implemented
    medium:
      value: "#cccccc"
      css-var: "--color-border-medium"
      status: implemented
      note: Input fields, card borders.
    light:
      value: "rgba(0, 0, 0, 0.15)"
      css-var: "--color-border-light"
      status: implemented
      note: Subtle card borders.

