# ──────────────────────────────────────────────────────────────────────────────
# SPACING TOKENS
# ──────────────────────────────────────────────────────────────────────────────

# Base unit: 4px. Scale: multiples of 4px.
# Naming: --space-N where N = rem × 4 (e.g. 0.25rem = 1 → --space-1)

spacing:
  1:   { value: "0.25rem", css-var: "--space-1",  status: defined }
  2:   { value: "0.5rem",  css-var: "--space-2",  status: implemented, note: "8px — badge padding, tight gap" }
  3:   { value: "0.75rem", css-var: "--space-3",  status: implemented, note: "12px — label margin" }
  4:   { value: "1rem",    css-var: "--space-4",  status: implemented, note: "16px — standard padding unit" }
  5:   { value: "1.25rem", css-var: "--space-5",  status: defined }
  6:   { value: "1.5rem",  css-var: "--space-6",  status: implemented, note: "24px — section-x, card padding" }
  8:   { value: "2rem",    css-var: "--space-8",  status: implemented, note: "32px — grid gap, card padding, margin" }
  10:  { value: "2.5rem",  css-var: "--space-10", status: implemented, note: "40px — section subtitle margin" }
  12:  { value: "3rem",    css-var: "--space-12", status: implemented, note: "48px — events section padding" }
  16:  { value: "4rem",    css-var: "--space-16", status: implemented, note: "64px — why-itj, featured-service padding" }
  20:  { value: "5rem",    css-var: "--space-20", status: defined,     note: "80px — defined; used as --section-y" }

