  sm:
    value: "0 2px 8px rgba(0, 0, 0, 0.06)"
    status: canonical
    note: Cards at rest. Consolidates 0.04–0.08 alpha variants at 2-8px spread.
  md:
    value: "0 4px 20px rgba(0, 0, 0, 0.08)"
    status: canonical
    note: Contact card, elevated components.
  lg:
    value: "0 8px 32px rgba(0, 0, 0, 0.10)"
    status: canonical
    note: CTA card, hero, featured components.
  button-primary:
    value: "0 4px 12px rgba(26, 94, 230, 0.30)"
    status: placeholder
    note: Blue button hover shadow. Update hex to match confirmed primary.
  button-secondary:
    value: "0 4px 12px rgba(46, 125, 50, 0.35)"
    status: decision
    note: Green button hover shadow. Update once secondary color is decided.

# ──────────────────────────────────────────────────────────────────────────────
# BREAKPOINT TOKENS
