  - id: D-02
    token: colors.cta
    status: RESOLVED
    resolution: >
      Primary CTA buttons use --color-primary (blue).
      Green (#2e7d32) reserved for semantic success/status (--color-success only).
      All 4 green CTA buttons changed to primary blue in 087D.1.
    blocking: false

  - id: D-03
    token: typography.font-family.webfont
    status: RESOLVED
    resolution: System fonts retained. Webfont deferred to future evaluation.
    blocking: false

  - id: D-04
    token: site_title
    status: RESOLVED
    resolution: config.toml title updated to "ITJ Solutions — AI Solutions".
    blocking: false

  - id: D-05
    token: colors.form.focus-ring
    status: RESOLVED
    resolution: >
      Form focus ring changed from #2e7d32 (green) to --color-primary (blue)
      in contact.css. Input borders, focus shadow, submit button all now use
      primary blue tokens.
    blocking: false

  - id: D-06
    token: typography.font-family.sans
    status: OPEN
    resolution: >
      --font-family-sans defined in tokens.css but not applied to body in page CSS.
      PaperMod owns the base font stack. Decision needed: override PaperMod font
      stack with --font-family-sans, or leave PaperMod default as the body font.
    blocking: false

  - id: D-07
    token: colors.text.primary (normalization)
    status: OPEN
    resolution: >
      #333, #222, #1a1a1a remain in page CSS alongside --color-text-primary (#111111).
      Values are close but not equal. Decision needed: normalize to #111111,
      or introduce separate --color-text-rich (#222222) and --color-text-soft (#333333)?
    blocking: false
