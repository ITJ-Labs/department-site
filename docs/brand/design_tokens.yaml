breakpoints:
  mobile:
    value: "400px"
    status: canonical
    note: Button goes full-width below this value. Found in multiple files.
  tablet:
    value: "600px"
    status: canonical
    note: Team grid collapses below this value.
  desktop:
    value: "768px"
    status: canonical
    note: Sidebar nav activates. Mobile drawer hidden. Primary layout breakpoint.

# ──────────────────────────────────────────────────────────────────────────────
# CONTAINER TOKENS
# ──────────────────────────────────────────────────────────────────────────────

container:
  page:
    value: "calc(960px - 220px)"   # 740px
    status: canonical
    note: Main content width with desktop sidebar active. Defined in nav.css.
  xl:
    value: "1080px"
    status: canonical
    note: Quick-links grid. Largest container in use.
  lg:
    value: "960px"
    status: canonical
    note: Featured service, hero section.
  md:
    value: "900px"
    status: canonical
    note: Services intro section.
  sm:
    value: "800px"
    status: canonical
    note: About, publications, CTA.
  xs:
    value: "600px"
    status: canonical
    note: Featured content box, hero quote.

# ──────────────────────────────────────────────────────────────────────────────
# Z-INDEX TOKENS
# ──────────────────────────────────────────────────────────────────────────────

z-index:
  nav-overlay:
    value: 999
    status: canonical
    note: Mobile nav backdrop (.nav-overlay). Below nav drawer.
  nav-drawer:
    value: 1000
    status: canonical
    note: Sidebar/drawer (.main-nav). Above overlay.
  nav-toggle:
    value: 1001
    status: canonical
    note: Hamburger button. Above nav drawer to remain tappable.
  modal:
    value: 1100
    status: gap
    note: Not yet used. Reserved for future modal components.
  tooltip:
    value: 1200
    status: gap
    note: Not yet used. Reserved for future tooltip components.

# ──────────────────────────────────────────────────────────────────────────────
# TRANSITION TOKENS
# ──────────────────────────────────────────────────────────────────────────────

transition:
  fast:
    value: "0.2s ease"
    status: canonical
    note: Buttons, card hover lift, link color changes. Most common duration.
  medium:
    value: "0.3s ease"
    status: canonical
    note: Nav drawer open/close, partner logo reveal.
  slow:
    value: "0.6s ease"
    status: canonical
    note: Card fade-in animations on scroll. Less common.

# ──────────────────────────────────────────────────────────────────────────────
# DECISIONS — STATUS AFTER SF-SLICE-087D.1
# ──────────────────────────────────────────────────────────────────────────────

decisions:
  - id: D-01
    token: colors.brand.primary
    status: RESOLVED (config-derived)
    resolution: >
      Used config.toml value: hsl(220,80%,50%) = #1a5ee6. Implemented as
      --color-primary across all CSS files. Pending official ITJ brand
      confirmation — update token value if confirmed blue differs.
    blocking: false

  - id: D-02
    token: colors.cta
    status: RESOLVED
    resolution: >
      Primary CTA buttons use --color-primary (blue).
      Green (#2e7d32) reserved for semantic success/status (--color-success only).
      All 4 green CTA buttons changed to primary blue in 087D.1.
    blocking: false

  - id: D-03
    token: typography.font-family.webfont
    status: RESOLVED
    resolution: System fonts retained. Webfont deferred to future evaluation.
    blocking: false

  - id: D-04
    token: site_title
    status: RESOLVED
    resolution: config.toml title updated to "ITJ Solutions — AI Solutions".
    blocking: false

  - id: D-05
    token: colors.form.focus-ring
    status: RESOLVED
    resolution: >
      Form focus ring changed from #2e7d32 (green) to --color-primary (blue)
      in contact.css. Input borders, focus shadow, submit button all now use
      primary blue tokens.
