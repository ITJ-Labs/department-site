# ITJ Solutions — AI Solutions Design Tokens
# Slice: SF-SLICE-087D.0 — Corporate Brand Discovery
# Date: 2026-06-25
# Status: DRAFT — Pending executive brand alignment
#
# Notation:
#   status: canonical   — confirmed and ready for implementation
#   status: placeholder — current best value; must be confirmed with ITJ brand team
#   status: decision    — requires stakeholder decision before implementation
#   status: gap         — no current value; token must be defined from scratch
#
# NOTE: This file contains token definitions ONLY.
# No CSS. No implementation. No :root {} blocks.
# Implementation will be delivered in SF-SLICE-087D.1.

meta:
  project: AI Solutions Digital Platform
  brand: ITJ Solutions — AI Solutions (sub-brand)
  parent_brand: ITJ Solutions (itj.com)
  parent_brand_direction: blue-to-purple gradient
  status: draft

# ──────────────────────────────────────────────────────────────────────────────
# COLOR TOKENS
# ──────────────────────────────────────────────────────────────────────────────

colors:

  # ── Brand Primary ─────────────────────────────────────────────────────────
  # D-01 RESOLVED (config-derived): itj.com is JS-rendered; CSS not extractable
  # via WebFetch. Using config.toml: primaryHue=220, S=80, L=50 = #1a5ee6.
  # Flagged as pending official ITJ brand confirmation.
  brand:
    primary:
      value: "hsl(220, 80%, 50%)"
      hex: "#1a5ee6"
      css-var: "--color-primary"
      status: implemented
      note: >
        Config-derived. All 6 ad-hoc blues replaced in 087D.1.
        Pending official ITJ corporate blue confirmation.
    primary-hover:
      value: "hsl(220, 80%, 42%)"
      hex: "#134fc4"
      css-var: "--color-primary-hover"
      status: implemented
      note: ~8% darker lightness. Button and link hover state.
    primary-light:
      value: "hsl(220, 80%, 60%)"
      hex: "#4a84f9"
      css-var: "--color-primary-light"
      status: implemented
      note: Accent value from config.toml accentLightness=60. Gradient highlights.
    primary-glow:
      value: "rgba(26, 94, 230, 0.30)"
      css-var: "--color-primary-glow"
      status: implemented
      note: Button hover shadow, derived from primary rgb(26, 94, 230).
    primary-focus-ring:
      value: "rgba(26, 94, 230, 0.20)"
      css-var: "--color-primary-focus-ring"
      status: implemented
      note: Focus ring shadow for inputs and interactive elements (D-05 resolved).

  # ── Brand Secondary / CTA ──────────────────────────────────────────────────
  # D-02 RESOLVED: Primary CTAs use --color-primary (blue).
  # Green is reserved for semantic success/status only (--color-success).
  # No separate secondary CTA color; secondary buttons use outline/ghost of primary.

  # ── Semantic ───────────────────────────────────────────────────────────────
  semantic:
    success:
      value: "#2e7d32"
      css-var: "--color-success"
      status: implemented
      note: >
        D-02 resolved: green reserved for success/status indicators only.
        All CTA buttons changed to --color-primary in 087D.1.
        #2e7d32 is the canonical success green (Material green-800).
    success-hover:
      value: "#256329"
      css-var: "--color-success-hover"
      status: implemented
    warning:
      value: "#b45309"
      status: gap
      note: No warning color defined in codebase. This is a suggested value (amber-700).
    danger:
      value: "#dc2626"
      status: gap
      note: >
        #dc3545 (Bootstrap red) appears only in publications card hover — likely unintentional.
        Needs an intentional danger token defined separately from that hover state.
    info:
      value: "#0369a1"
      status: gap
      note: No info color defined. This is a suggested value (sky-700).

  # ── Text ──────────────────────────────────────────────────────────────────
  text:
    primary:
      value: "#111111"
      status: canonical
      note: Dark text on light background. Consolidates #111, #1a1a1a, #222.
    secondary:
      value: "#444444"
      status: canonical
      note: Body secondary text. Consolidates #333, #444, #555.
    muted:
      value: "#666666"
      status: canonical
      note: Placeholder, captions, metadata.
    disabled:
      value: "#999999"
      status: gap
      note: No disabled text color defined. Suggested value.
    inverse:
      value: "#ffffff"
      status: canonical
      note: Text on dark/colored backgrounds. Used in nav, dark sections.
    inverse-muted:
      value: "#e0e0e0"
      status: canonical
      note: Subdued text on dark backgrounds. Found in services.css dark sections.
    link:
      value: "color.brand.primary"
      status: canonical
      note: Links default to primary brand color via PaperMod --primary variable.
    link-hover:
      value: "color.brand.primary-hover"
      status: canonical

  # ── Background ──────────────────────────────────────────────────────────────
  background:
    page:
      value: "#ffffff"
      status: canonical
      note: Main page background. PaperMod --background in light mode.
    surface:
      value: "#ffffff"
      status: canonical
      note: Card and panel background.
    surface-alt:
      value: "#f9f9f9"
      status: canonical
      note: Alternating section backgrounds. Consolidates #f5f5f5 and #f9f9f9.
    overlay:
      value: "rgba(0, 0, 0, 0.4)"
      status: canonical
      note: Mobile nav drawer backdrop (.nav-overlay).
    dark-section:
      value: "#0f172a"
      status: gap
      note: >
        services.css uses inline dark backgrounds for feature blocks.
        No canonical dark background token defined. Suggested value: slate-900.

  # ── Border ────────────────────────────────────────────────────────────────
  border:
    default:
      value: "#e1e1e1"
      status: canonical
      note: Standard card and component borders. Consolidates #ccc, #e1e1e1, rgba(0,0,0,0.15).
    subtle:
      value: "rgba(0, 0, 0, 0.08)"
      status: canonical
      note: Very light borders, icon frames.
    focus:
      value: "color.brand.primary"
      status: decision
      note: >
        Currently #2e7d32 (green) for contact form focus ring.
        Should change to primary blue — aligns focus ring with brand color.
        Confirm before implementation.

# ──────────────────────────────────────────────────────────────────────────────
# TYPOGRAPHY TOKENS
# ──────────────────────────────────────────────────────────────────────────────

typography:

  # ── Font Family ───────────────────────────────────────────────────────────
  font-family:
    base:
      value: >
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
      status: placeholder
      note: >
        PaperMod system font stack. No webfont currently defined.
        Decision required: keep system fonts or introduce enterprise webfont?
        Candidates: Inter, IBM Plex Sans, Source Sans Pro.
    webfont:
      value: "DECISION_REQUIRED"
      status: decision
      note: >
        ITJ corporate typeface not confirmed. Requires inspection of itj.com CSS
        or brand guidelines document from brand team.
    mono:
      value: "'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace"
      status: canonical
      note: Code blocks. PaperMod default.

  # ── Type Scale ────────────────────────────────────────────────────────────
  # Based on ad-hoc sizes found across CSS files. Not a formal scale currently.
  # Suggested canonical scale. Values must be reviewed before 087D.1.
  scale:
    display:
      value: "3rem"      # 48px
      status: gap
      note: Not currently used. Suggested hero display size.
    h1:
      value: "2.5rem"    # 40px
      status: canonical
      note: Hero page title. Found in hero.html styles.
    h2:
      value: "2rem"      # 32px
      status: canonical
      note: Section headers. why-itj, cta, featured-service.
    h3:
      value: "1.5rem"    # 24px
      status: canonical
      note: Subsection, card titles. contact, featured-content.
    h4:
      value: "1.25rem"   # 20px
      status: canonical
      note: Event titles, pub cards.
    h5:
      value: "1.1rem"    # 17.6px
      status: gap
      note: Not currently defined. Suggested.
    body-lg:
      value: "1.125rem"  # 18px
      status: gap
      note: Larger body text. Not currently defined.
    body:
      value: "1rem"      # 16px
      status: canonical
      note: Default body text.
    body-sm:
      value: "0.95rem"   # 15.2px
      status: canonical
      note: Subtitle, metadata text.
    caption:
      value: "0.875rem"  # 14px
      status: canonical
      note: Small labels, badge text.
    micro:
      value: "0.75rem"   # 12px
      status: gap
      note: Not defined. Suggested for legal, footnotes.

  # ── Font Weight ───────────────────────────────────────────────────────────
  weight:
    regular:
      value: 400
      status: canonical
    medium:
      value: 500
      status: canonical
      note: Nav items, labels.
    semibold:
      value: 600
      status: canonical
      note: Buttons, form labels, emphasized text.
    bold:
      value: 700
      status: canonical
      note: Headings.

  # ── Line Height ───────────────────────────────────────────────────────────
  line-height:
    tight:
      value: 1.2
      status: canonical
      note: Headings.
    compact:
      value: 1.4
      status: canonical
      note: Dense UI text.
    default:
      value: 1.6
      status: canonical
      note: Body text. Most common value across CSS files.

# ──────────────────────────────────────────────────────────────────────────────
# SPACING TOKENS
# ──────────────────────────────────────────────────────────────────────────────

# Base unit: 4px. Scale: 1 2 3 4 6 8 12 16 20 24 32 (multiples of 4px base).
# Current codebase uses ad-hoc rem values. These tokens codify the intent.

spacing:
  1:
    value: "0.25rem"   # 4px
    status: gap
  2:
    value: "0.5rem"    # 8px
    status: canonical
    note: Tight component padding, icon margins.
  3:
    value: "0.75rem"   # 12px
    status: canonical
  4:
    value: "1rem"      # 16px
    status: canonical
    note: Standard component padding.
  5:
    value: "1.25rem"   # 20px
    status: gap
  6:
    value: "1.5rem"    # 24px
    status: canonical
    note: Card inner padding, grid gaps.
  8:
    value: "2rem"      # 32px
    status: canonical
    note: Standard section padding, card padding (large).
  10:
    value: "2.5rem"    # 40px
    status: gap
  12:
    value: "3rem"      # 48px
    status: canonical
    note: Section vertical padding (mobile).
  16:
    value: "4rem"      # 64px
    status: canonical
    note: Section vertical padding (desktop).
  20:
    value: "5rem"      # 80px
    status: canonical
    note: Large section vertical padding.

# ──────────────────────────────────────────────────────────────────────────────
# BORDER RADIUS TOKENS
# ──────────────────────────────────────────────────────────────────────────────

border-radius:
  none:
    value: "0"
    status: canonical
  sm:
    value: "4px"
    status: gap
    note: Not found in codebase. Suggested for small UI elements.
  button:
    value: "6px"
    status: canonical
    note: Buttons and form inputs. Consistent across most of codebase.
  badge:
    value: "8px"
    status: canonical
    note: Badges, small labels.
  card:
    value: "12px"
    status: canonical
    note: Standard card radius. Most common value. Supersedes 10px and 16px variants.
  card-lg:
    value: "16px"
    status: placeholder
    note: Featured/elevated card. Currently only in featured-service.css. May consolidate to card.
  pill:
    value: "9999px"
    status: canonical
    note: Full-pill shape. Currently used in publications filter buttons.

