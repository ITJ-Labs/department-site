{{ define "main" }}
  <h1>Research & Publications</h1>
  <div class="pub-grid">
    {{ range .Pages.ByDate.Reverse }}
      <a 
        href="{{ .Params.externalURL | safeURL }}"
        class="pub-card"
        target="_blank"
        rel="noopener noreferrer"
      >
        <div class="pub-card-content">
          <h2>{{ .Title }}</h2>
          <p class="meta">
            {{ .Date.Format "Jan 2, 2006" }} • {{ delimit .Params.authors ", " }}
          </p>
          <p>{{ .Params.summary }}</p>
        </div>
      </a>
    {{ end }}
  </div>
{{ end }}
