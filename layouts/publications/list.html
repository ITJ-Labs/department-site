{{ define "main" }}
<article class="post-single publications-list">

  <header class="post-header">
    <h1 class="post-title">Publications</h1>
  </header>

  <div class="pub-grid flash-cards">
    {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="pub-card flash-card">
        <div class="flash-card-content">
          <h2>{{ .Title }}</h2>
          <p class="meta">{{ .Date.Format "Jan 2, 2006" }} &bull; {{ delimit .Params.authors ", " }}</p>
          <p class="summary">{{ .Params.summary }}</p>
        </div>
      </a>
    {{ else }}
      <p>No publications found.</p>
    {{ end }}
  </div>

</article>
{{ end }}
