{{/* layouts/shortcodes/contact-form.html */}}

<form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="contact" />
  <p hidden><label>Don’t fill if you’re human: <input name="bot-field" /></label></p>

  <div class="form-group">
    <label for="name">Your Name</label>
    <input id="name" type="text" name="name" placeholder="Jane Doe" required>
  </div>

  <div class="form-group">
    <label for="email">Your Email</label>
    <input id="email" type="email" name="email" placeholder="you@example.com" required>
  </div>

  <div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" placeholder="How can we help you today?" required></textarea>
  </div>

  <p class="form-group">
    <button type="submit" class="button success">Send Message</button>
  </p>
</form>
